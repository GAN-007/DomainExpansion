name: Validate Imported FreeDomain Snapshot

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-freedomain-import
  cancel-in-progress: false

jobs:
  validate:
    name: Validate all imported files
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/import-freedomain'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out imported branch
        uses: actions/checkout@v4
        with:
          ref: agent/import-freedomain
          fetch-depth: 0
          persist-credentials: true

      - name: Run complete snapshot validation
        id: validation
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "${RUNNER_TEMP}/validate_import.py" <<'PY'
          from __future__ import annotations

          import collections
          import pathlib
          import re
          import subprocess
          import sys
          import urllib.parse

          root = pathlib.Path.cwd().resolve()
          tracked = [pathlib.Path(p) for p in subprocess.check_output(['git', 'ls-files'], text=True).splitlines()]
          expected_file_count = 84  # 83 upstream files plus this temporary validator.

          errors: list[str] = []
          if len(tracked) != expected_file_count:
              errors.append(f'Unexpected tracked-file count: expected {expected_file_count}, found {len(tracked)}')

          required = [
              pathlib.Path('README.md'),
              pathlib.Path('LEARN.md'),
              pathlib.Path('LICENSE'),
              pathlib.Path('.github/FUNDING.yml'),
              pathlib.Path('assets/logo.jpg'),
              pathlib.Path('documents/domains/announcement.md'),
              pathlib.Path('documents/domains/faq.md'),
              pathlib.Path('documents/tutorial/index.md'),
              pathlib.Path('documents/tutorial/BOOK_PLAN.md'),
          ]
          for path in required:
              if not (root / path).is_file():
                  errors.append(f'Missing required file: {path}')

          forbidden = [
              pathlib.Path('.transfer-bootstrap'),
              pathlib.Path('.source-archive-link.md'),
              pathlib.Path('.github/workflows/import-upstream.yml'),
          ]
          for path in forbidden:
              if (root / path).exists():
                  errors.append(f'Temporary transfer artifact still present: {path}')

          extensions = collections.Counter((path.suffix.lower() or '<none>') for path in tracked)
          markdown_files = [path for path in tracked if path.suffix.lower() == '.md']
          markdown_link = re.compile(r'!?\[[^\]]*\]\(([^)]+)\)')
          html_ref = re.compile(r'(?:src|href)=["\']([^"\']+)["\']', re.IGNORECASE)
          fenced_code = re.compile(r'(^|\n)[ \t]*(```|~~~).*?\n[ \t]*\2[ \t]*(?=\n|$)', re.DOTALL)
          inline_code = re.compile(r'`[^`\n]*`')

          def normalize_target(raw: str) -> str | None:
              raw = raw.strip()
              if not raw:
                  return None
              if raw.startswith('<') and raw.endswith('>'):
                  raw = raw[1:-1].strip()
              if ' "' in raw:
                  raw = raw.split(' "', 1)[0]
              elif " '" in raw:
                  raw = raw.split(" '", 1)[0]
              parsed = urllib.parse.urlsplit(raw)
              if parsed.scheme or raw.startswith('//') or raw.startswith('#'):
                  return None
              return urllib.parse.unquote(parsed.path) or None

          for markdown in markdown_files:
              try:
                  text = (root / markdown).read_text(encoding='utf-8')
              except UnicodeDecodeError as exc:
                  errors.append(f'Invalid UTF-8 Markdown file {markdown}: {exc}')
                  continue

              # Tutorial chapters intentionally contain complete example websites and
              # sample absolute routes. Validate navigation/content references only,
              # not href/src values contained inside fenced or inline code examples.
              scan_text = fenced_code.sub('\n', text)
              scan_text = inline_code.sub('', scan_text)

              refs = [match.group(1) for match in markdown_link.finditer(scan_text)]
              refs.extend(match.group(1) for match in html_ref.finditer(scan_text))
              for raw in refs:
                  target = normalize_target(raw)
                  if target is None:
                      continue
                  candidate = (root / markdown.parent / target).resolve()
                  try:
                      candidate.relative_to(root)
                  except ValueError:
                      errors.append(f'Internal reference escapes repository root: {markdown} -> {raw}')
                      continue
                  if not candidate.exists():
                      errors.append(f'Broken internal reference: {markdown} -> {raw}')

          signatures = {
              '.png': b'\x89PNG\r\n\x1a\n',
              '.jpg': b'\xff\xd8\xff',
              '.jpeg': b'\xff\xd8\xff',
          }
          binary_files = [path for path in tracked if path.suffix.lower() in signatures]
          for path in binary_files:
              data = (root / path).read_bytes()
              if not data:
                  errors.append(f'Empty binary asset: {path}')
              elif not data.startswith(signatures[path.suffix.lower()]):
                  errors.append(f'Invalid binary signature: {path}')

          manifests = [
              'package.json', 'pnpm-lock.yaml', 'yarn.lock', 'package-lock.json',
              'pyproject.toml', 'requirements.txt', 'Pipfile', 'poetry.lock',
              'go.mod', 'Cargo.toml', 'composer.json', 'Gemfile',
              'Dockerfile', 'docker-compose.yml', 'compose.yaml',
          ]
          present_manifests = [name for name in manifests if (root / name).exists()]

          print('FreeDomain snapshot validation report')
          print(f'Tracked files including temporary validator: {len(tracked)}')
          print(f'Expected upstream files after validator removal: {len(tracked) - 1}')
          print(f'Markdown files: {len(markdown_files)}')
          print(f'Binary image assets: {len(binary_files)}')
          print('Extension distribution: ' + ', '.join(f'{key}={value}' for key, value in sorted(extensions.items())))
          print('Application manifests detected: ' + (', '.join(present_manifests) if present_manifests else 'none'))
          print(f'Validation errors: {len(errors)}')
          for error in errors:
              print(f'ERROR: {error}')

          raise SystemExit(1 if errors else 0)
          PY

          set +e
          python3 "${RUNNER_TEMP}/validate_import.py" > validation-report.txt 2>&1
          validation_status=$?
          set -e
          cat validation-report.txt
          printf 'status=%s\n' "${validation_status}" >> "${GITHUB_OUTPUT}"

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freedomain-validation-report-${{ github.run_id }}
          path: validation-report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Fail when validation found errors
        if: steps.validation.outputs.status != '0'
        shell: bash
        run: |
          echo "Snapshot validation failed. See the uploaded validation report."
          exit 1

      - name: Remove validator and preserve exact upstream tree
        if: steps.validation.outputs.status == '0'
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/validate-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit \
            -m "Validate imported FreeDomain snapshot" \
            -m "Validated 83 upstream files, Markdown navigation references, required paths, and PNG/JPEG signatures. The final tree removes this one-use validator."
          git push origin HEAD:agent/import-freedomain
