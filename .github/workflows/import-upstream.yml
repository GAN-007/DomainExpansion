name: Import FreeDomain Upstream Snapshot

on:
  push:
    branches:
      - agent/import-freedomain
    paths:
      - .github/workflows/import-upstream.yml

permissions:
  contents: write

concurrency:
  group: import-freedomain-upstream
  cancel-in-progress: false

jobs:
  import:
    name: Import pinned upstream snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SOURCE_REPOSITORY: DigitalPlatDev/FreeDomain
      SOURCE_COMMIT: 95a006cdd8525b8a6f5d5db082e31a6bcf2e6cb9
      TARGET_BRANCH: agent/import-freedomain

    steps:
      - name: Check out transfer branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download immutable upstream archive
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/freedomain-${SOURCE_COMMIT}.tar.gz"
          url="https://github.com/${SOURCE_REPOSITORY}/archive/${SOURCE_COMMIT}.tar.gz"
          curl --fail --location --retry 5 --retry-delay 2 --connect-timeout 20 \
            --output "${archive}" "${url}"
          test -s "${archive}"
          tar -tzf "${archive}" >/dev/null
          printf 'UPSTREAM_ARCHIVE=%s\n' "${archive}" >> "${GITHUB_ENV}"

      - name: Extract and validate source snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          extract_root="${RUNNER_TEMP}/freedomain-extracted"
          rm -rf "${extract_root}"
          mkdir -p "${extract_root}"
          tar -xzf "${UPSTREAM_ARCHIVE}" -C "${extract_root}"

          source_dir="$(find "${extract_root}" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "${source_dir}"
          test -f "${source_dir}/README.md"
          test -f "${source_dir}/LICENSE"
          test -f "${source_dir}/LEARN.md"

          source_file_count="$(find "${source_dir}" -type f -print | wc -l | tr -d ' ')"
          source_directory_count="$(find "${source_dir}" -type d -print | wc -l | tr -d ' ')"
          test "${source_file_count}" -gt 0

          printf 'SOURCE_DIR=%s\n' "${source_dir}" >> "${GITHUB_ENV}"
          printf 'SOURCE_FILE_COUNT=%s\n' "${source_file_count}" >> "${GITHUB_ENV}"
          printf 'SOURCE_DIRECTORY_COUNT=%s\n' "${source_directory_count}" >> "${GITHUB_ENV}"

          echo "Pinned source commit: ${SOURCE_COMMIT}"
          echo "Source files: ${source_file_count}"
          echo "Source directories: ${source_directory_count}"

      - name: Replace branch contents with source snapshot
        shell: bash
        run: |
          set -Eeuo pipefail

          # Remove every tracked and untracked working-tree item while preserving .git.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +

          # Copy dotfiles, documentation, and binary assets exactly from the pinned archive.
          cp -a "${SOURCE_DIR}/." .

          # The source snapshot must remain the sole branch content; the importer deletes itself here.
          git add --all

          staged_file_count="$(git diff --cached --name-only --diff-filter=ACMR | wc -l | tr -d ' ')"
          deletion_count="$(git diff --cached --name-only --diff-filter=D | wc -l | tr -d ' ')"
          echo "Staged source files: ${staged_file_count}"
          echo "Removed bootstrap/transfer files: ${deletion_count}"

          test -f README.md
          test -f LICENSE
          test -f LEARN.md
          test -f assets/logo.jpg
          test -f documents/domains/announcement.md
          test -f documents/domains/faq.md
          test -f documents/tutorial/index.md
          test ! -e .transfer-bootstrap
          test ! -e .source-archive-link.md
          test ! -e .github/workflows/import-upstream.yml

      - name: Commit exact imported snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No import changes were produced."
            exit 1
          fi

          git commit \
            -m "Import DigitalPlatDev/FreeDomain at ${SOURCE_COMMIT}" \
            -m "Source repository: https://github.com/${SOURCE_REPOSITORY}" \
            -m "Pinned source files: ${SOURCE_FILE_COUNT}; source directories: ${SOURCE_DIRECTORY_COUNT}."

      - name: Verify committed inventory and push
        shell: bash
        run: |
          set -Eeuo pipefail

          committed_file_count="$(git ls-files | wc -l | tr -d ' ')"
          if [ "${committed_file_count}" != "${SOURCE_FILE_COUNT}" ]; then
            echo "Inventory mismatch: source=${SOURCE_FILE_COUNT}, committed=${committed_file_count}" >&2
            exit 1
          fi

          test -z "$(git status --porcelain)"
          git push origin "HEAD:${TARGET_BRANCH}"

          echo "Imported ${committed_file_count} files from ${SOURCE_REPOSITORY}@${SOURCE_COMMIT}."
          echo "Final commit: $(git rev-parse HEAD)"
