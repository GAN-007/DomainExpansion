name: Ruff Autofix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  autofix:
    if: github.head_ref == 'agent/domainoss-full-production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/domainoss-full-production
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply Ruff fixes once
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -f .ruff-autofix-complete ]; then
            echo "Ruff autofix already applied."
            exit 0
          fi
          python -m pip install -e '.[dev]'
          ruff check . --fix --unsafe-fixes || true
          chmod +x tests/integration/run_backends.py tests/integration/webhook_receiver.py
          touch .ruff-autofix-complete
          git add --all -- ':!.github/workflows/ruff-autofix.yml'
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply automated Ruff source fixes"
          git push origin HEAD:agent/domainoss-full-production
